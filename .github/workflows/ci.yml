name: audit-lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest
      - run: python -m audit_lab --format markdown --output audit-catalog.md
      - uses: actions/upload-artifact@v4
        with:
          name: audit-catalog
          path: audit-catalog.md
